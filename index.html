<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日区直播订单管理系统</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    primary: {
                        50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
                        400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
                        800: '#1e40af', 900: '#1e3a8a',
                    },
                },
                animation: {
                    'fade-in': 'fadeIn 0.3s ease-out',
                    'slide-up': 'slideUp 0.3s ease-out',
                    'slide-down': 'slideDown 0.3s ease-out',
                },
                keyframes: {
                    fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                    slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                    slideDown: { '0%': { opacity: '0', transform: 'translateY(-20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                },
            }
        }
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Microsoft YaHei', Arial, sans-serif;
            background: #0f172a;
            min-height: 100vh; padding: 20px; color: #e2e8f0;
        }
        .container { max-width: 1500px; margin: 0 auto; }
        .header { text-align: center; padding: 20px 20px; margin-bottom: 20px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 16px; border: 1px solid rgba(148,163,184,0.1); }
        .header h1 { font-size: 22px; font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
        .header p { font-size: 13px; color: #64748b; }
        .card { background: #1e293b; border-radius: 16px; padding: 24px;
            border: 1px solid rgba(148, 163, 184, 0.1); margin-bottom: 20px; }
        .btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer;
            font-size: 13px; font-weight: 600; transition: all 0.2s; display: inline-flex;
            align-items: center; gap: 6px; white-space: nowrap; }
        .btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .btn-secondary { background: rgba(148, 163, 184, 0.15); color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.2); }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .btn-info { background: linear-gradient(135deg, #06b6d4, #0891b2); color: white; }
        .input-field { width: 100%; padding: 10px 14px; background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 8px; color: #e2e8f0;
            font-size: 13px; transition: all 0.2s; }
        .input-field:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        .input-field::placeholder { color: #475569; }
        label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 4px; }
        .order-item { background: #0f172a; border-radius: 12px; padding: 16px;
            margin-bottom: 10px; border: 1px solid rgba(148, 163, 184, 0.08); transition: all 0.2s; }
        .order-item:hover { border-color: rgba(99, 102, 241, 0.3); }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); z-index: 10000; justify-content: center; align-items: center;
            padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: #1e293b; border-radius: 20px; padding: 30px; width: 100%;
            max-width: 500px; max-height: 90vh; overflow-y: auto;
            border: 1px solid rgba(148, 163, 184, 0.15); animation: slideUp 0.3s ease-out; }
        .modal-close { position: absolute; top: 15px; right: 15px; width: 32px; height: 32px;
            border-radius: 50%; border: none; background: rgba(255,255,255,0.1); color: #fff;
            font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .image-preview-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .image-preview-item { position: relative; width: 70px; height: 70px; border-radius: 8px;
            overflow: hidden; border: 1px solid rgba(148, 163, 184, 0.2); }
        .image-preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .image-preview-item .remove-btn { position: absolute; top: -4px; right: -4px; width: 20px;
            height: 20px; border-radius: 50%; border: none; background: rgba(239, 68, 68, 0.9);
            color: white; font-size: 11px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; }
        .order-images { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .order-images img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover;
            cursor: pointer; border: 1px solid rgba(148, 163, 184, 0.1); }
        .tag { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .tag-active { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .tag-ended { background: rgba(148, 163, 184, 0.2); color: #94a3b8; }
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 99999; display: flex;
            flex-direction: column; gap: 10px; }
        .toast { padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 500;
            animation: slideDown 0.3s ease-out; display: flex; align-items: center; gap: 8px;
            min-width: 260px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .toast-success { background: #065f46; color: #a7f3d0; border: 1px solid rgba(16,185,129,0.3); }
        .toast-error { background: #7f1d1d; color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
        .toast-info { background: #1e3a5f; color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
        .toast-warning { background: #78350f; color: #fcd34d; border: 1px solid rgba(245,158,11,0.3); }
        .image-preview-modal { display: none; position: fixed; top: 0; left: 0; width: 100%;
            height: 100%; background: rgba(0,0,0,0.95); z-index: 100000; justify-content: center;
            align-items: center; cursor: pointer; }
        .image-preview-modal.show { display: flex; }
        .image-preview-modal img { max-width: 90vw; max-height: 90vh; border-radius: 10px; }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 99998; justify-content: center; align-items: center; }
        .loading-overlay.show { display: flex; }
        .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(99,102,241,0.2);
            border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .session-select { background: rgba(15,23,42,0.8); border: 1px solid rgba(148,163,184,0.2);
            color: #e2e8f0; border-radius: 8px; padding: 10px 14px; font-size: 13px; width: 100%; }
        .session-select:focus { outline: none; border-color: #6366f1; }
        .session-select option { background: #1e293b; color: #e2e8f0; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.15); border-radius: 3px; }
        .text-green { color: #10b981; }
        .text-muted { color: #64748b; }
        .flex-center { display: flex; align-items: center; }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }
        .gap-4 { gap: 16px; }
        .main-split { display: flex; gap: 20px; align-items: flex-start; }
        .main-split > .left-panel { width: 400px; flex-shrink: 0; }
        .main-split > .right-panel { flex: 1; min-width: 0; }
        @media (max-width: 960px) { .main-split { flex-direction: column; }
            .main-split > .left-panel { width: 100%; } }
        .status-info { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
            font-size: 13px; margin-bottom: 14px; }
        .status-info .label { color: #64748b; }
        .status-info .value { color: #e2e8f0; font-weight: 500; }
        .status-info .value.green { color: #10b981; }
        .query-bar { display: flex; gap: 10px; align-items: center; }
        .query-bar input { flex: 1; }
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start;
            flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
        .top-bar-left { display: flex; flex-wrap: wrap; gap: 8px; }
        .top-bar-right { min-width: 300px; flex: 1; max-width: 500px; }
        .section-title { font-size: 15px; font-weight: 600; color: #e2e8f0;
            margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .order-header { display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 10px; }
        .order-header-left { display: flex; align-items: center; gap: 10px; }
        .order-badge { background: rgba(99,102,241,0.2); color: #a5b4fc; padding: 1px 8px;
            border-radius: 4px; font-size: 11px; font-weight: 600; }
        .order-time { font-size: 11px; color: #475569; margin-top: 8px; display: flex; align-items: center; gap: 4px; }
        .order-actions { display: flex; gap: 6px; }
        .order-actions .btn { padding: 5px 10px; font-size: 12px; }
        .hidden { display: none; }
    </style>
    <!-- AiPexBase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/aipexbase-js/dist/aipexbase.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📦 日区直播订单管理系统</h1>
            <p>云端存储 · 多设备同步</p>
        </div>

        <!-- Top Bar: session info + actions + query -->
        <div class="card" style="padding:18px 24px;">
            <div class="top-bar">
                <div class="top-bar-left">
                    <button class="btn btn-primary" onclick="openSessionModal()">📅 创建/更换场次</button>
                    <button class="btn btn-warning" onclick="endSession()">🏁 直播结束</button>
                    <button class="btn btn-info" onclick="exportHTML()">🌐 HTML导出</button>
                    <button class="btn btn-danger" onclick="deleteSession()">🗑️ 删除场次</button>
                    <button class="btn btn-danger" onclick="clearOrders()">🗑️ 清空订单</button>
                    <button class="btn btn-secondary" onclick="openHelp()">❓ 使用说明</button>
                </div>
                <div class="top-bar-right">
                    <div class="query-bar">
                        <select id="querySessionSelect" class="session-select" style="flex:1;">
                            <option value="">-- 选择场次 --</option>
                        </select>
                        <button class="btn btn-success" onclick="doQuery()">🔍 查询订单</button>
                    </div>
                </div>
            </div>
            <div class="status-info">
                <span><span class="label">当前场次：</span><span id="curSessionNo" class="value green">-</span></span>
                <span><span class="label">主播：</span><span id="curAnchor" class="value">-</span></span>
                <span><span class="label">场次时间：</span><span id="curSessionTime" class="value green">-</span></span>
                <span id="curStatusTag"></span>
            </div>
        </div>

        <!-- Main Split: Left (Add Order) + Right (Order List) -->
        <div class="main-split">
            <!-- Left Panel: Add Order -->
            <div class="left-panel">
                <div class="card" style="padding:20px;">
                    <div class="section-title">➕ 添加订单</div>
                    <div style="margin-bottom:14px;">
                        <label><span class="text-green" style="color:#ef4444;">*</span> 订单号</label>
                        <input type="text" id="orderNo" class="input-field" placeholder="输入订单号" required>
                    </div>
                    <div style="margin-bottom:14px;">
                        <label>备注信息</label>
                        <input type="text" id="orderNote" class="input-field" placeholder="输入备注信息（选填）">
                    </div>
                    <div style="margin-bottom:14px;">
                        <label>商品图片</label>
                        <div class="flex" style="display:flex;gap:8px;flex-wrap:wrap;">
                            <button class="btn btn-success" onclick="takePhoto()" style="flex:1;">📷 拍照</button>
                            <button class="btn btn-primary" onclick="document.getElementById('imageFile').click()" style="flex:1;">🖼️ 上传图片</button>
                        </div>
                        <input type="file" id="imageFile" accept="image/*" multiple class="hidden" onchange="handleImageUpload(event)">
                        <div id="imagePreview" class="image-preview-container"></div>
                    </div>
                    <div class="flex" style="display:flex;gap:8px;">
                        <button class="btn btn-success" onclick="saveOrder()" style="flex:1;">💾 保存订单</button>
                        <button class="btn btn-primary" onclick="saveOrderAndNext()" style="flex:1;">➡️ 下一个订单</button>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Order List -->
            <div class="right-panel">
                <div class="card" style="padding:20px;max-height:calc(100vh - 280px);overflow-y:auto;">
                    <div class="flex" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
                        <div class="section-title" style="margin-bottom:0;">📋 订单列表</div>
                        <span class="text-muted" id="orderCount" style="font-size:13px;">共 0 单</span>
                    </div>
                    <div id="orderList" class="space-y-3">
                        <div style="text-align:center;color:#475569;padding:40px 0;font-size:14px;">暂无订单数据</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Session Modal -->
    <div id="sessionModal" class="modal-overlay">
        <div class="modal-content relative">
            <button onclick="closeSessionModal()" class="modal-close">×</button>
            <h3 style="color:#fff;font-size:20px;font-weight:700;margin-bottom:20px;text-align:center;">📅 创建直播场次</h3>
            <div style="display:flex;flex-direction:column;gap:14px;">
                <div>
                    <label><span style="color:#ef4444;">*</span> 场次名称</label>
                    <input type="text" id="sessionName" class="input-field" placeholder="例如: 日区6.21晚场" required>
                </div>
                <div>
                    <label><span style="color:#ef4444;">*</span> 直播日期</label>
                    <input type="date" id="sessionDate" class="input-field" required>
                </div>
                <div>
                    <label>直播时间</label>
                    <input type="text" id="sessionTime" class="input-field" placeholder="例如: 19:00-22:00">
                </div>
                <div>
                    <label>主播信息</label>
                    <input type="text" id="sessionAnchor" class="input-field" placeholder="选填">
                </div>
                <button class="btn btn-success" style="width:100%;justify-content:center;" onclick="createSession()">创建场次</button>
            </div>
            <hr style="border:none;border-top:1px solid rgba(148,163,184,0.15);margin:20px 0;">
            <h4 style="color:#e2e8f0;font-size:15px;font-weight:600;margin-bottom:12px;">🔄 切换已有场次</h4>
            <select id="switchSessionSelect" class="session-select" style="margin-bottom:12px;" onchange="onSwitchSession()">
                <option value="">-- 选择场次 --</option>
            </select>
        </div>
    </div>

    <!-- Edit Order Modal -->
    <div id="editOrderModal" class="modal-overlay">
        <div class="modal-content relative">
            <button onclick="closeEditModal()" class="modal-close">×</button>
            <h3 style="color:#fff;font-size:20px;font-weight:700;margin-bottom:20px;text-align:center;">✏️ 编辑订单</h3>
            <div style="display:flex;flex-direction:column;gap:14px;">
                <div>
                    <label><span style="color:#ef4444;">*</span> 订单号</label>
                    <input type="text" id="editOrderNo" class="input-field" required>
                </div>
                <div>
                    <label>备注信息</label>
                    <input type="text" id="editOrderNote" class="input-field" placeholder="选填">
                </div>
                <div>
                    <label>商品图片</label>
                    <div style="display:flex;gap:8px;">
                        <button class="btn btn-success" onclick="takePhoto('edit')" style="flex:1;">📷 拍照</button>
                        <button class="btn btn-primary" onclick="document.getElementById('editImageFile').click()" style="flex:1;">🖼️ 上传图片</button>
                    </div>
                    <input type="file" id="editImageFile" accept="image/*" multiple class="hidden" onchange="handleEditImageUpload(event)">
                    <div id="editImagePreview" class="image-preview-container"></div>
                </div>
                <button class="btn btn-success" style="width:100%;justify-content:center;" onclick="saveEditOrder()">💾 保存修改</button>
            </div>
        </div>
    </div>

    <!-- Camera Modal -->
    <div id="cameraModal" class="modal-overlay">
        <div style="max-width:700px;width:100%;position:relative;">
            <button onclick="closeCameraModal()" class="modal-close">×</button>
            <div style="background:#1e293b;border-radius:16px;padding:24px;border:1px solid rgba(148,163,184,0.15);">
                <h3 style="color:#fff;font-size:18px;font-weight:700;margin-bottom:16px;text-align:center;">📷 拍照预览</h3>
                <video id="cameraPreview" style="width:100%;max-width:640px;border-radius:10px;background:#000;margin:0 auto;display:block;" autoplay playsinline></video>
                <div style="display:flex;justify-content:center;margin-top:16px;gap:12px;">
                    <button onclick="captureFromPreview()" class="btn btn-success" style="padding:10px 30px;">📸 拍照</button>
                    <button onclick="closeCameraModal()" class="btn btn-secondary">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Preview Modal -->
    <div id="imagePreviewModal" class="image-preview-modal" onclick="this.classList.remove('show')">
        <img id="previewImageFull" src="" alt="预览">
    </div>

    <!-- Loading -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- Toast -->
    <div id="toast-container"></div>

    <script>
        // ============================================================
        // 初始化 AiPexBase 客户端
        // ============================================================
        const baseUrl = 'https://baas.kuafuai.net/baas-api';
        const apiKey = 'baas_jTsw5yWU';
        const client = aipexbase.createClient({ baseUrl, apiKey });

        // ============================================================
        // 状态
        // ============================================================
        let currentSession = null;
        let allSessions = [];
        let orders = [];
        let editingImages = [];
        let editImagesTemp = [];
        let editingOrderIndex = null;
        const UPLOAD_URL = baseUrl + '/common/upload';

        // ============================================================
        // Toast
        // ============================================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            toast.innerHTML = `${icons[type] || 'ℹ️'} ${message}`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease-out';
                setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('show', show);
        }

        // ============================================================
        // 摄像头（首次授权后缓存流，不再重复请求）
        // ============================================================
        let cameraStream = null;
        let cameraMode = 'add';

        function takePhoto(mode) {
            cameraMode = mode || 'add';
            if (cameraStream) {
                showCameraPreview(cameraStream);
                return;
            }
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => { cameraStream = stream; showCameraPreview(stream); })
                .catch(err => {
                    console.error('拍照失败:', err);
                    showToast('无法访问摄像头，请检查权限设置！', 'error');
                });
        }

        function showCameraPreview(stream) {
            document.getElementById('cameraPreview').srcObject = stream;
            document.getElementById('cameraModal').classList.add('show');
        }

        function captureFromPreview() {
            const video = document.getElementById('cameraPreview');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg', 0.8);
            if (cameraMode === 'edit') {
                editImagesTemp.push(imageData);
                renderEditImagePreview();
            } else {
                editingImages.push(imageData);
                renderImagePreview();
            }
            closeCameraModal();
        }

        function closeCameraModal() {
            document.getElementById('cameraModal').classList.remove('show');
        }

        // ============================================================
        // 图片上传工具
        // ============================================================
        async function uploadFile(file) {
            const token = localStorage.getItem('baas_token');
            const formData = new FormData();
            formData.append('file', file);
            const response = await fetch(UPLOAD_URL, {
                method: 'POST',
                headers: {
                    'Authorization': token ? `Bearer ${token}` : '',
                    'CODE_FLYING': apiKey
                },
                body: formData
            });
            const result = await response.json();
            if (result.success && result.data) { return result.data.url; }
            throw new Error(result.message || '上传失败');
        }

        function dataURLtoBlob(dataurl) {
            const arr = dataurl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) { u8arr[n] = bstr.charCodeAt(n); }
            return new Blob([u8arr], { type: mime });
        }

        function handleImageUpload(event) {
            const files = event.target.files; if (!files || files.length === 0) return;
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) { editingImages.push(e.target.result); renderImagePreview(); };
                reader.readAsDataURL(file);
            });
            event.target.value = '';
        }
        function renderImagePreview() {
            let html = '';
            editingImages.forEach((img, index) => {
                html += `<div class="image-preview-item"><img src="${img}" alt="图片"><button class="remove-btn" onclick="editingImages.splice(${index},1);renderImagePreview();">×</button></div>`;
            });
            document.getElementById('imagePreview').innerHTML = html;
        }

        function handleEditImageUpload(event) {
            const files = event.target.files; if (!files || files.length === 0) return;
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) { editImagesTemp.push(e.target.result); renderEditImagePreview(); };
                reader.readAsDataURL(file);
            });
            event.target.value = '';
        }
        function renderEditImagePreview() {
            let html = '';
            editImagesTemp.forEach((img, index) => {
                const src = typeof img === 'string' ? img : (img.url || img);
                html += `<div class="image-preview-item"><img src="${src}" alt="图片"><button class="remove-btn" onclick="editImagesTemp.splice(${index},1);renderEditImagePreview();">×</button></div>`;
            });
            document.getElementById('editImagePreview').innerHTML = html;
        }

        function openImagePreview(src) {
            document.getElementById('previewImageFull').src = src;
            document.getElementById('imagePreviewModal').classList.add('show');
        }

        // ============================================================
        // 数据操作（云端）
        // ============================================================
        async function loadSessions() {
            const res = await client.db.from('sessions').list().order('created_at', 'desc');
            if (res.success) {
                allSessions = res.data || [];
                renderSessionSelects();
            }
        }

        async function loadOrders(sessionId) {
            if (!sessionId) { orders = []; renderOrders(); return; }
            const res = await client.db.from('orders').list()
                .eq('session_id', sessionId)
                .order('created_at', 'desc');
            if (res.success) { orders = res.data || []; } else { orders = []; }
            renderOrders();
        }

        function renderSessionSelects() {
            // Dropdown in modal
            const sel = document.getElementById('switchSessionSelect');
            sel.innerHTML = '<option value="">-- 选择场次 --</option>';
            // Dropdown in top query bar
            const querySel = document.getElementById('querySessionSelect');
            querySel.innerHTML = '<option value="">-- 选择场次 --</option>';
            allSessions.forEach(s => {
                const opt1 = document.createElement('option');
                opt1.value = s.id;
                opt1.textContent = `${s.session_no} | ${s.anchor || '-'} | ${s.session_date}`;
                sel.appendChild(opt1);
                const opt2 = document.createElement('option');
                opt2.value = s.id;
                opt2.textContent = `${s.session_no} | ${s.anchor || '-'} | ${s.session_date}`;
                querySel.appendChild(opt2);
            });
        }

        function updateStatusBar(session) {
            if (session) {
                document.getElementById('curSessionNo').textContent = session.session_no || '-';
                document.getElementById('curAnchor').textContent = session.anchor || '-';
                document.getElementById('curSessionTime').textContent = session.session_date + (session.session_time ? ' ' + session.session_time : '');
                const tag = document.getElementById('curStatusTag');
                if (session.status === 'active') {
                    tag.innerHTML = '<span class="tag tag-active">进行中</span>';
                } else {
                    tag.innerHTML = '<span class="tag tag-ended">已结束</span>';
                }
            } else {
                document.getElementById('curSessionNo').textContent = '-';
                document.getElementById('curAnchor').textContent = '-';
                document.getElementById('curSessionTime').textContent = '-';
                document.getElementById('curStatusTag').innerHTML = '';
            }
        }

        function renderOrders() {
            document.getElementById('orderCount').textContent = `共 ${orders.length} 单`;
            const container = document.getElementById('orderList');
            if (!orders || orders.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#475569;padding:40px 0;font-size:14px;">暂无订单数据</div>';
                return;
            }
            let html = '';
            orders.forEach((order, idx) => {
                const images = order.images || [];
                const getImgUrl = (img) => typeof img === 'string' ? img : (img.url || '');
                const imgsHtml = images.length > 0
                    ? images.filter(img => getImgUrl(img)).map(img => `<img src="${getImgUrl(img)}" onclick="openImagePreview('${getImgUrl(img)}')" alt="商品图片">`).join('')
                    : '<span style="color:#475569;font-size:12px;">无图片</span>';
                html += `
                <div class="order-item">
                    <div class="order-header">
                        <div class="order-header-left">
                            <span style="color:#94a3b8;font-size:13px;">订单 #${idx + 1}</span>
                            <span class="order-badge">${order.order_no || '-'}</span>
                        </div>
                        <div class="order-actions">
                            <button class="btn btn-primary" onclick='openEditModal(${JSON.stringify(order).replace(/'/g,"&#39;")})'>✏️ 编辑</button>
                            <button class="btn btn-danger" onclick="deleteOrder(${order.id})">🗑️ 删除</button>
                        </div>
                    </div>
                    <div style="margin-bottom:6px;"><span style="color:#64748b;font-size:12px;">订单号：</span><span style="color:#e2e8f0;font-size:13px;">${order.order_no || '-'}</span></div>
                    ${order.note ? `<div style="margin-bottom:6px;"><span style="color:#64748b;font-size:12px;">备注：</span><span style="color:#e2e8f0;font-size:13px;">${order.note}</span></div>` : ''}
                    <div><span style="color:#64748b;font-size:12px;">商品图片 (${images.length}张)</span></div>
                    <div class="order-images">${imgsHtml}</div>
                    <div class="order-time">⏰ ${order.created_at ? new Date(order.created_at).toLocaleString('zh-CN') : '-'}</div>
                </div>`;
            });
            container.innerHTML = html;
        }

        async function doQuery() {
            const sel = document.getElementById('querySessionSelect');
            const id = parseInt(sel.value);
            if (!id) { showToast('请选择一个场次', 'warning'); return; }
            const session = allSessions.find(s => s.id === id);
            if (session) {
                currentSession = session;
                updateStatusBar(session);
                await loadOrders(id);
                showToast(`已加载场次: ${session.name || session.session_no}`);
            }
        }

        // ============================================================
        // 场次操作
        // ============================================================
        async function createSession() {
            const name = document.getElementById('sessionName').value.trim();
            const date = document.getElementById('sessionDate').value;
            const time = document.getElementById('sessionTime').value.trim();
            const anchor = document.getElementById('sessionAnchor').value.trim();
            if (!name) { showToast('请输入场次名称', 'error'); return; }
            if (!date) { showToast('请选择直播日期', 'error'); return; }
            const sessionNo = 'S' + date.replace(/-/g, '') + '-' + Math.random().toString(36).substr(2,4).toUpperCase();
            const now = new Date().toISOString().slice(0,19).replace('T',' ');
            const res = await client.db.from('sessions').insert()
                .values({ name, session_date: date, session_time: time || '', anchor: anchor || '', session_no: sessionNo, status: 'active', created_at: now });
            if (!res.success) { showToast('创建场次失败','error'); return; }
            currentSession = { id: res.data, name, session_date: date, session_time: time, anchor, session_no: sessionNo, status: 'active', created_at: now };
            showToast(`场次 "${name}" 创建成功 🎉`);
            closeSessionModal();
            await loadSessions();
            await loadOrders(currentSession.id);
            updateStatusBar(currentSession);
            document.getElementById('sessionName').value = '';
            document.getElementById('sessionDate').value = '';
            document.getElementById('sessionTime').value = '';
            document.getElementById('sessionAnchor').value = '';
        }

        async function endSession() {
            if (!currentSession) { showToast('当前没有进行中的场次','warning'); return; }
            if (currentSession.status !== 'active') { showToast('该场次已结束','info'); return; }
            if (!confirm(`确定要结束场次 "${currentSession.name}" 吗？`)) return;
            const res = await client.db.from('sessions').update().set({ status: 'ended' }).eq('id', currentSession.id);
            if (!res.success) { showToast('操作失败','error'); return; }
            currentSession.status = 'ended';
            showToast('场次已结束');
            updateStatusBar(currentSession);
            await loadSessions();
        }

        async function deleteSession() {
            if (!currentSession) { showToast('当前没有场次','warning'); return; }
            if (!confirm(`⚠️ 确定要删除场次 "${currentSession.name}" 及其所有订单吗？`)) return;
            showLoading(true);
            await client.db.from('orders').delete().eq('session_id', currentSession.id);
            await client.db.from('sessions').delete().eq('id', currentSession.id);
            showLoading(false);
            showToast('场次已删除');
            currentSession = null; orders = [];
            updateStatusBar(null); renderOrders();
            await loadSessions();
        }

        async function clearOrders() {
            if (!currentSession) { showToast('当前没有场次','warning'); return; }
            if (orders.length === 0) { showToast('当前场次没有订单','info'); return; }
            if (!confirm(`确定要清空当前场次的所有订单 (${orders.length}单) 吗？`)) return;
            showLoading(true);
            await client.db.from('orders').delete().eq('session_id', currentSession.id);
            showLoading(false);
            showToast('订单已清空');
            await loadOrders(currentSession.id);
        }

        // ============================================================
        // 订单操作
        // ============================================================
        async function saveOrder() {
            if (!currentSession) { showToast('请先创建或选择一个场次','warning'); return; }
            const orderNo = document.getElementById('orderNo').value.trim();
            const note = document.getElementById('orderNote').value.trim();
            if (!orderNo) { showToast('请输入订单号','error'); return; }
            showLoading(true);
            let imageUrls = [];
            for (const img of editingImages) {
                try {
                    if (img.startsWith('data:')) {
                        const blob = dataURLtoBlob(img);
                        const file = new File([blob], 'product.jpg', { type: 'image/jpeg' });
                        imageUrls.push(await uploadFile(file));
                    } else { imageUrls.push(img); }
                } catch (e) { showToast('图片上传失败','error'); showLoading(false); return; }
            }
            const now = new Date().toISOString().slice(0,19).replace('T',' ');
            const res = await client.db.from('orders').insert()
                .values({ order_no: orderNo, note: note || '', images: imageUrls, session_id: currentSession.id, created_at: now });
            showLoading(false);
            if (!res.success) { showToast('保存失败','error'); return; }
            showToast('订单保存成功 ✅');
            editingImages = []; renderImagePreview();
            document.getElementById('orderNo').value = '';
            document.getElementById('orderNote').value = '';
            await loadOrders(currentSession.id);
        }

        async function saveOrderAndNext() { await saveOrder(); document.getElementById('orderNo').focus(); }

        async function deleteOrder(orderId) {
            if (!confirm('确定要删除该订单吗？')) return;
            showLoading(true);
            const res = await client.db.from('orders').delete().eq('id', orderId);
            showLoading(false);
            if (!res.success) { showToast('删除失败','error'); return; }
            showToast('订单已删除');
            await loadOrders(currentSession.id);
        }

        function openEditModal(order) {
            editingOrderIndex = order.id;
            document.getElementById('editOrderNo').value = order.order_no;
            document.getElementById('editOrderNote').value = order.note || '';
            editImagesTemp = (order.images && order.images.length > 0) ? order.images.map(i => typeof i === 'string' ? i : i.url).filter(Boolean) : [];
            renderEditImagePreview();
            document.getElementById('editOrderModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editOrderModal').classList.remove('show');
            editImagesTemp = []; editingOrderIndex = null;
        }

        async function saveEditOrder() {
            if (!editingOrderIndex) { showToast('数据错误','error'); return; }
            const orderNo = document.getElementById('editOrderNo').value.trim();
            const note = document.getElementById('editOrderNote').value.trim();
            if (!orderNo) { showToast('请输入订单号','error'); return; }
            showLoading(true);
            let finalImages = [];
            for (const img of editImagesTemp) {
                const imgSrc = typeof img === 'string' ? img : (img.url || '');
                if (imgSrc.startsWith('data:')) {
                    try {
                        const blob = dataURLtoBlob(img);
                        const file = new File([blob], 'product.jpg', { type: 'image/jpeg' });
                        finalImages.push(await uploadFile(file));
                    } catch (e) { showToast('图片上传失败','error'); showLoading(false); return; }
                } else { finalImages.push(img); }
            }
            const res = await client.db.from('orders').update()
                .set({ order_no: orderNo, note: note || '', images: finalImages })
                .eq('id', editingOrderIndex);
            showLoading(false);
            if (!res.success) { showToast('保存失败','error'); return; }
            showToast('修改已保存 ✅');
            closeEditModal();
            await loadOrders(currentSession.id);
        }

        // ============================================================
        // 导出 HTML
        // ============================================================
        async function exportHTML() {
            if (!currentSession || orders.length === 0) { showToast('当前场次没有订单可导出','warning'); return; }
            const getImgUrl = (img) => typeof img === 'string' ? img : (img.url || '');
            let rows = '';
            orders.forEach((o,i) => {
                const imgs = (o.images || []).filter(img => getImgUrl(img)).map(img => `<img src="${getImgUrl(img)}" style="max-width:100px;max-height:100px;margin:2px;border-radius:4px;">`).join('') || '无';
                rows += `<tr><td>${i+1}</td><td>${o.order_no||'-'}</td><td>${o.note||'-'}</td><td>${imgs}</td><td>${o.created_at?new Date(o.created_at).toLocaleString('zh-CN'):'-'}</td></tr>`;
            });
            const html = `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>${currentSession.name} - 订单导出</title><style>body{font-family:sans-serif;padding:20px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #ddd;padding:8px;text-align:left;}th{background:#f5f5f5;}img{vertical-align:middle;}</style></head><body><h1>📦 ${currentSession.name}</h1><p>场次: ${currentSession.session_no} | 日期: ${currentSession.session_date} | 共 ${orders.length} 单 | 导出: ${new Date().toLocaleString('zh-CN')}</p><table><thead><tr><th>#</th><th>订单号</th><th>备注</th><th>商品图片</th><th>时间</th></tr></thead><tbody>${rows}</tbody></table><p style="color:#999;font-size:12px;">* 图片为网络链接，需联网查看</p></body></html>`;
            const blob = new Blob([html], { type:'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `${currentSession.session_no}_订单导出.html`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('导出成功 ✅');
        }

        // ============================================================
        // Help
        // ============================================================
        function openHelp() {
            showToast('点击"创建/更换场次"开始使用，场次内录入订单，数据自动保存到云端', 'info');
        }

        // ============================================================
        // 模态框
        // ============================================================
        function openSessionModal() {
            document.getElementById('sessionModal').classList.add('show');
            const today = new Date().toISOString().slice(0,10);
            document.getElementById('sessionDate').value = today;
            renderSessionSelects();
        }
        function closeSessionModal() { document.getElementById('sessionModal').classList.remove('show'); }

        // ============================================================
        // 初始化
        // ============================================================
        async function init() {
            showLoading(true);
            try {
                await loadSessions();
                const active = allSessions.find(s => s.status === 'active');
                if (active) { currentSession = active; updateStatusBar(active); await loadOrders(active.id); }
                else if (allSessions.length > 0) { currentSession = allSessions[0]; updateStatusBar(currentSession); await loadOrders(currentSession.id); }
            } catch (e) { showToast('加载数据失败: ' + e.message, 'error'); }
            showLoading(false);
        }
        init();
    </script>
</body>
</html>
